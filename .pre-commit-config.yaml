repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --extra dev ruff check
        language: system
        types: [python]
      - id: ruff
        name: ruff-check
        entry: uv run --extra dev ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run --extra dev ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: uv run --extra dev mypy backend/src --config-file mypy.ini
        language: system
        pass_filenames: false
        files: ^(backend/.*\.py|mypy\.ini|pyproject\.toml|uv\.lock)$
      - id: mypy-evaluation
        name: mypy (evaluation)
        entry: uv run --extra dev mypy --config-file evaluation/mypy.ini evaluation/evaluate_analyser.py evaluation/evaluate_extractor.py evaluation/src evaluation/tests
        language: system
        pass_filenames: false
        files: ^(evaluation/.*\.py|evaluation/mypy\.ini|pyproject\.toml|uv\.lock)$
      - id: backend-tests
        name: Backend tests
        entry: uv run --extra dev python -m unittest discover -s backend/tests
        language: system
        pass_filenames: false
        files: ^(backend/.*\.(py|yaml)|pyproject\.toml|uv\.lock)$
      - id: evaluation-tests
        name: Evaluation tests
        entry: uv run --extra dev python -m unittest discover -s evaluation/tests -t evaluation
        language: system
        pass_filenames: false
        files: ^(evaluation/.*\.(py|yaml)|pyproject\.toml|uv\.lock)$
      - id: react-frontend-build
        name: React frontend build
        entry: npm --prefix frontend run build
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: react-frontend-tests
        name: React frontend tests
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: react-frontend-lint
        name: React frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
