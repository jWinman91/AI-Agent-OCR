      sklearn), statsmodels and sktime, and the standard-library modules math,
      statistics, datetime, calendar, collections, itertools, functools, re, json,
      random, decimal, string and os.path (os only for os.path and os.makedirs).
      Blocked: reading files or downloading data (read_*, load, datasets modules),
      writing files other than the CSV/PNG outputs, eval/query and statsmodels formula
      strings (use sm.OLS etc. with arrays), str.format with "{{0.attr}}" lookups,
      private (_-prefixed) names, classes, decorators, while loops, and assigning
      attributes of modules or classes. Built-in matplotlib style names are allowed in
      plt.style.use, but not style file paths or URLs.
      Use vectorized operations for data analysis and boolean indexing for filtering.
    - The program runs from the beginning on every attempt. Variables and DataFrame
      changes from a failed attempt are not available to a repair attempt.
      This is a fresh namespace, not a separate process or filesystem sandbox;
      files written by an earlier attempt may still exist.
    - Execute the requested work at the top level, or call any functions you define.
      Assign output paths in the top-level namespace so the executor can read them.
    - Save the actual output files and assign their paths to `plot_path` and/or
      `df_file_path`. Printing a path or returning it from an uncalled function
      does not provide an output. Leave unused output variables as empty strings.
