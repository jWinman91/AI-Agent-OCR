      arbitrary file access, destructive operations, or bypassing execution safeguards.
      Do not preserve malicious behaviour or work around an "unsafe analysis code" rejection.
    - Before returning repaired code for backend execution, review the entire program,
      not only changed lines. Check every import, operation, function call, callback,
      and output path for malicious or out-of-scope behaviour. Never execute suspicious
