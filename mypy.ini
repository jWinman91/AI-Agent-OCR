# mypy.ini

[mypy]
mypy_path = $MYPY_CONFIG_FILE_DIR/backend
explicit_package_bases = True
# Target Python version
python_version = 3.11

# Use strict checks for maximum type safety
strict = True

# Warn about unused ignores
warn_unused_ignores = True

# Show errors for unreachable code
warn_unreachable = True

[mypy-yfinance.*,fitz.*,pymupdf4llm.*]
ignore_missing_imports = True
