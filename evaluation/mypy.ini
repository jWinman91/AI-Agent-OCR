# mypy.ini for evaluation/
#
# Separate from the root mypy.ini, because both backend/ and evaluation/ have a
# top-level `src` package and the evaluation code imports it as `src.*` from
# evaluation/.

[mypy]
mypy_path = $MYPY_CONFIG_FILE_DIR
explicit_package_bases = True
python_version = 3.11
strict = True
warn_unused_ignores = True
warn_unreachable = True

[mypy-multipledispatch.*]
ignore_missing_imports = True
