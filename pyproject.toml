[project]
name = "ai-agent-ocr"
version = "0.1.0"
description = "AI Agent OCR backend and Streamlit app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "AI-Agent-OCR Maintainers" }
]

# Application dependencies
dependencies = [
  "fastapi",
  "loguru",
  "uvicorn",
  "pydantic-ai",
  "pandas",
  "polars",
  "openpyxl",
  "xlrd",
  "pyaml",
  "pillow",
  "matplotlib",
  "streamlit",
  "st_pages",
  "pyyaml",
  "multipledispatch",
  "yfinance",
  "seaborn",
  "matplotlib",
  "pdf2image",
  "pymupdf",
  "pymupdf4llm",
  "numpy",
  "statsmodels",
  "scikit-learn",
  "opencv-python",
  "sktime",
  "pdf_inspector",
  "mlflow"
]

[project.optional-dependencies]
# Developer tooling
dev = [
  "mypy",
  "ruff",
  "pre-commit",
  "pandas-stubs",
  "types-PyYAML",
]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
